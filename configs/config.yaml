project:
  name: plant-disease-classifier
  seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  classes:
    - Healthy
    - Powdery
    - Rust
  num_classes: 3
  image_size: 224          # Input size for pretrained models (224x224)

transforms:
  normalize_mean: [0.485, 0.456, 0.406]   # ImageNet mean
  normalize_std: [0.229, 0.224, 0.225]    # ImageNet std
  augmentation:
    random_horizontal_flip: true
    random_vertical_flip: false
    random_rotation: 15
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2

dataloader:
  batch_size: 32
  num_workers: 4
  pin_memory: true

training:
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam           # adam | sgd
  scheduler: cosine         # cosine | step | none
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.001

model:
  name: custom_cnn          # custom_cnn | efficientnet_b0 | resnet50
  pretrained: false         # true only for pretrained models
  dropout: 0.3

mlflow:
  tracking_uri: http://localhost:5000
  experiment_name: plant-disease-classification

paths:
  logs_dir: logs
  checkpoints_dir: checkpoints
  artifacts_dir: artifacts
