project:
  name: plant-disease-classifier
  seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  splits:
    train: Train
    val: Validation
    test: Test
  classes:
    - Healthy
    - Powdery
    - Rust
  num_classes: 3
  # Sizes are (height, width). Raw images are ~4000x2700 (ratio 3:2).
  preprocess_size: [341, 512]   # one-time downscale stored in data/processed
  image_size: [224, 336]        # model input size (keeps the 3:2 ratio)

transforms:
  normalize_mean: [0.485, 0.456, 0.406]   # ImageNet mean
  normalize_std: [0.229, 0.224, 0.225]    # ImageNet std
  augmentation:
    random_resized_crop_scale: [0.6, 1.0]
    random_horizontal_flip: true
    random_vertical_flip: false
    random_rotation: 15
    color_jitter:
      brightness: 0.3     # raised: brightness differs between classes
      contrast: 0.2
      saturation: 0.2
      hue: 0.0            # no hue shift: color is a real disease signal

dataloader:
  batch_size: 32
  num_workers: 1            # 2-core CPU: data loading is cheap, leave cores to the model
  pin_memory: true

training:
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam           # adam | sgd
  scheduler: cosine         # cosine | step | none
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.001

model:
  name: custom_cnn          # custom_cnn | mobilenet_v3_small | efficientnet_b0 | resnet50
  pretrained: false         # true only for pretrained models
  unfreeze_blocks: null     # pretrained models: null = train all, 0 = head only, N = head + last N blocks
  dropout: 0.3

mlflow:
  tracking_uri: sqlite:///mlflow.db   # overridden by the MLFLOW_TRACKING_URI env var
  experiment_name: plant-disease-classification

paths:
  logs_dir: logs
  checkpoints_dir: checkpoints
  artifacts_dir: artifacts
